<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="Example receipt from Offa Main Market for ₦180,000">
  <rect width="600" height="800" fill="#ece8dc"/>
  <g transform="rotate(-1.2 300 400)">
    <rect x="70" y="40" width="460" height="720" rx="6" fill="#fffdf7" stroke="#d9d3c3" stroke-width="2"/>
    <text x="300" y="120" text-anchor="middle" font-family="Courier New, monospace" font-size="26" font-weight="700" fill="#2d333d">OFFA MAIN MARKET</text>
    <text x="300" y="158" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#4b5260">CASH SALES RECEIPT</text>
    <path d="M110 192h380" stroke="#b9b2a0" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="110" y="236" font-family="Courier New, monospace" font-size="20" fill="#2d333d">DATE: 18/09/2026</text>
    <text x="110" y="300" font-family="Courier New, monospace" font-size="20" fill="#2d333d">Blankets, 60</text>
