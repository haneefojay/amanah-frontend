    <text x="490" y="426" text-anchor="end" font-family="Courier New, monospace" font-size="24" font-weight="700" fill="#161a20">N180,000</text>
    <path d="M110 470h380" stroke="#b9b2a0" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="110" y="520" font-family="Courier New, monospace" font-size="18" fill="#4b5260">RECEIVED WITH THANKS</text>
    <path d="M330 610c30-30 60 10 90-20s40 20 70-10" fill="none" stroke="#2d4f9e" stroke-width="3"/>
    <text x="300" y="712" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#8a8f98">EXAMPLE RECEIPT</text>
